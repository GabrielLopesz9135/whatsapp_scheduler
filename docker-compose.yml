services:
  mongodb:
    image: mongo:7.0
    container_name: scheduler_mongo
    command: ["--replSet", "rs0", "--bind_ip_all", "--port", "27017"]
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: test $$(mongosh --port 27017 --quiet --eval "try { rs.status().ok } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'localhost:27017'}]}).ok }") -eq 1
      interval: 5s
      timeout: 10s
      retries: 5
      start_period: 5s

volumes:
  mongo_data: