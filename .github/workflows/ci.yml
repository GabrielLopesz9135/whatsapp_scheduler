name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend:
    name: Backend Tests & Integration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Start MongoDB & Redis (Docker Compose)
        run: docker compose up -d --wait

      - name: Install Backend Dependencies
        run: |
          cd backend
          npm ci

      - name: Populate Database (Seed)
        run: |
          cd backend
          npm run seed
        env:
          MONGO_URI: mongodb://localhost:27017/whatsapp-scheduler?replicaSet=rs0&directConnection=true
          JWT_SECRET: dev_secret_key_ci_testing_12345
          WHATSAPP_PHONE_NUMBER_ID: 1434118393114940
          WHATSAPP_API_TOKEN: test_ci_token
          WHATSAPP_VERIFY_TOKEN: meu_token_secreto_webhook_123
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379

      - name: Run Integration Tests
        run: |
          cd backend
          npm test
        env:
          MONGO_URI: mongodb://localhost:27017/whatsapp-scheduler?replicaSet=rs0&directConnection=true
          JWT_SECRET: dev_secret_key_ci_testing_12345
          WHATSAPP_PHONE_NUMBER_ID: 1434118393114940
          WHATSAPP_API_TOKEN: test_ci_token
          WHATSAPP_VERIFY_TOKEN: meu_token_secreto_webhook_123
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379

  frontend:
    name: Frontend Build (Vite)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Build Frontend Production Bundle
        run: |
          cd frontend
          npm run build

